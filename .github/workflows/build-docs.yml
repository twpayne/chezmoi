name: build-docs
on:
  pull_request:
    branches:
    - master
    paths:
    - assets/chezmoi.io/**
    - pyproject.toml
    - uv.lock
    - .github/workflows/build-docs.yml
    - .github/workflows/preview-docs.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  # FIXME get the following values from main.yml
  GO_VERSION: 1.27.2 # https://go.dev/doc/devel/release
  PYTHON_VERSION: '3.14' # https://www.python.org/downloads/
  UV_VERSION: 0.12.24 # https://github.com/astral-sh/uv/releases
  NO_MKDOCS_2_WARNING: 1
jobs:
  build-docs:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-go
      with:
        cache-prefix: website-go
        go-version: ${{ env.GO_VERSION }}
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0
      with:
        enable-cache: false
        version: ${{ env.UV_VERSION }}
    - name: install-website-dependencies
      run: |
        uv python install ${{ env.PYTHON_VERSION }}
        uv sync --locked
    - name: build-website
      run: uv run -v task build-docs
      env:
        CHEZMOI_GITHUB_TOKEN: ${{ secrets.CHEZMOI_GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PYTHONDONTWRITEBYTECODE: 1
    - name: compute-docs-digest
      run: echo "${{ hashFiles('assets/chezmoi.io/site/**') }}" > assets/chezmoi.io/digest.txt
    - name: upload-docs-preview
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
      with:
        name: docs-site-preview
        path: |
          assets/chezmoi.io/site/
          assets/chezmoi.io/digest.txt
        retention-days: 1
