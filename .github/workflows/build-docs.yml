name: build-docs
on:
  pull_request:
    branches:
    - master
    paths:
    - assets/chezmoi.io/**
    - pyproject.toml
    - uv.lock
    - .github/workflows/build-docs.yml
    - .github/workflows/preview-docs.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  GOTOOLCHAIN: local
  NO_MKDOCS_2_WARNING: 1
jobs:
  versions:
    uses: ./.github/workflows/versions.yml
  build-docs:
    needs: versions
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-go
      with:
        cache-prefix: website-go
        go-version: ${{ needs.versions.outputs.go-version }}
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
      with:
        enable-cache: false
        version: ${{ needs.versions.outputs.uv-version }}
    - name: install-website-dependencies
      run: |
        uv python install ${{ needs.versions.outputs.python-version }}
        uv sync --locked
    - name: build-website
      run: uv run -v task build-docs
      env:
        CHEZMOI_GITHUB_TOKEN: ${{ secrets.CHEZMOI_GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PYTHONDONTWRITEBYTECODE: 1
    - name: compute-docs-digest
      run: echo "${{ hashFiles('assets/chezmoi.io/site/**') }}" > assets/chezmoi.io/digest.txt
    - name: upload-docs-preview
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
      with:
        name: docs-site-preview
        path: |
          assets/chezmoi.io/site/
          assets/chezmoi.io/digest.txt
        retention-days: 1
