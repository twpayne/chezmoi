name: installer
on:
  pull_request:
    branches:
    - master
  push:
    branches:
    - master
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      sh: ${{ steps.filter.outputs.sh }}
      ps1: ${{ steps.filter.outputs.ps1 }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - id: filter
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d   # v4.0.3
      with:
        filters: |
          shared: &shared
          - '.github/workflows/installer.yml'
          sh:
          - *shared
          - 'assets/scripts/install*.sh'
          - 'internal/cmds/generate-install.sh/install.sh.tmpl'
          ps1:
          - *shared
          - 'assets/scripts/install.ps1'
  misspell:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - uses: reviewdog/action-misspell@7cea3d501cb3834c688e08c89ed77b71764d1784   # v1.30.1
      with:
        locale: US
        ignore: importas,Produktive
  test-install-sh:
    if: ${{ needs.changes.outputs.sh == 'true' }}
    strategy:
      matrix:
        os:
        - macos-14
        - ubuntu-22.04
        - windows-2022
    needs: changes
    runs-on: ${{ matrix.os }}
    env:
      BINARY: ${{ matrix.os == 'windows-2022' && 'bin/chezmoi.exe' || 'bin/chezmoi' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - name: test-${{ matrix.os }}-local-not-on-path
      shell: bash
      run: |
        rm -f ${{ env.BINARY }}
        if sh -c "command -v chezmoi"; then
          echo "Test precondition failed: chezmoi is already available on PATH." >&2
          exit 1
        fi
        sh assets/scripts/install.sh -d 2>installer-stderr.log || {
          cat installer-stderr.log >&2
          exit 1
        }
        cat installer-stderr.log >&2
        if ! grep -Fq "add bin to your PATH to use chezmoi" installer-stderr.log; then
          echo "Expected PATH guidance was not printed." >&2
          exit 1
        fi
        ${{ env.BINARY }} --version
    - name: test-${{ matrix.os }}-local-on-path
      shell: bash
      run: |
        export PATH="$PWD/bin:${PATH}"
        if ! sh -c "command -v chezmoi"; then
          echo "Test precondition failed: chezmoi is unavailable on PATH." >&2
          exit 1
        fi
        sh assets/scripts/install.sh -d 2>installer-stderr.log || {
          cat installer-stderr.log >&2
          exit 1
        }
        cat installer-stderr.log >&2
        if grep -Fq "add bin to your PATH to use chezmoi" installer-stderr.log; then
          echo "Unexpected PATH guidance was printed." >&2
          exit 1
        fi
        chezmoi --version
    - name: test-${{ matrix.os }}-url
      shell: bash
      run: |
        rm -f ${{ env.BINARY }}
        sh -c "$(curl -fsLS https://raw.githubusercontent.com/twpayne/chezmoi/${{ env.SHA }}/assets/scripts/install.sh)" -- -d
        ${{ env.BINARY }} --version
  test-install-ps1:
    if: ${{ needs.changes.outputs.ps1 == 'true' }}
    strategy:
      matrix:
        os:
        - macos-14
        - ubuntu-22.04
        - windows-2022
    needs: changes
    runs-on: ${{ matrix.os }}
    env:
      BINARY: ${{ matrix.os == 'windows-2022' && 'bin/chezmoi.exe' || 'bin/chezmoi' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - name: test-${{ matrix.os }}-local-pwsh
      shell: pwsh
      run: |
        if (Test-Path -Path ${{ env.BINARY }}) { Remove-Item -Force ${{ env.BINARY }} }
        assets/scripts/install.ps1 -d
        ${{ env.BINARY }} --version
    - name: test-${{ matrix.os }}-local-powershell
      if: matrix.os == 'windows-2022'
      shell: powershell
      run: |
        if (Test-Path -Path ${{ env.BINARY }}) { Remove-Item -Force ${{ env.BINARY }} }
        assets/scripts/install.ps1 -d
        ${{ env.BINARY }} --version
    - name: test-${{ matrix.os }}-url-pwsh
      shell: pwsh
      run: |
        if (Test-Path -Path ${{ env.BINARY }}) { Remove-Item -Force ${{ env.BINARY }} }
        iex "&{$(irm 'https://raw.githubusercontent.com/twpayne/chezmoi/${{ env.SHA }}/assets/scripts/install.ps1')} -d"
        ${{ env.BINARY }} --version
    - name: test-${{ matrix.os }}-url-powershell
      if: matrix.os == 'windows-2022'
      shell: powershell
      run: |
        if (Test-Path -Path ${{ env.BINARY }}) { Remove-Item -Force ${{ env.BINARY }} }
        iex "&{$(irm 'https://raw.githubusercontent.com/twpayne/chezmoi/${{ env.SHA }}/assets/scripts/install.ps1')} -d"
        ${{ env.BINARY }} --version
